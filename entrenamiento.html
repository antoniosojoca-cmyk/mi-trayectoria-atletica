

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrenamiento — Mi trayectoria atlética</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }

    .carrusel {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #080808;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease;
    }

    .slide.activo {
      opacity: 1;
      visibility: visible;
    }

    .slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Oscurece ligeramente la parte inferior para facilitar la lectura */
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.05) 45%,
        rgba(0,0,0,0.78) 100%
      );
      pointer-events: none;
    }

    .texto {
      position: absolute;
      z-index: 5;
      left: 8%;
      right: 8%;
      bottom: 10%;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .texto h1 {
      margin: 0 0 15px;
      color: #d4af37;
      font-size: clamp(30px, 4vw, 52px);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .texto p {
      max-width: 900px;
      margin: 0 auto;
      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.6;
    }

    .flecha {
      position: absolute;
      z-index: 10;
      top: 50%;
      transform: translateY(-50%);
      width: 55px;
      height: 55px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: #ffffff;
      font-size: 35px;
      line-height: 48px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .flecha:hover {
      background: rgba(0,0,0,0.75);
      border-color: #d4af37;
      color: #d4af37;
    }

    .izquierda {
      left: 25px;
    }

    .derecha {
      right: 25px;
    }

    .puntos {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .punto.activo {
      background: #d4af37;
      transform: scale(1.3);
    }
