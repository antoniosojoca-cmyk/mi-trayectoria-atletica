<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi trayectoria atlética</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* PORTADA */

        header {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 20px 90px;

            background: #111;
        }

        /* FOTOGRAFÍA */

        .foto-portada {
            width: 100%;
            max-width: 1050px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0 auto 28px;
        }

        .foto-portada img {
            display: block;

            width: auto;
            max-width: 100%;
            height: auto;

            max-height: 68vh;

            object-fit: contain;

            border: 1px solid rgba(216, 176, 106, 0.45);

            box-shadow:
                0 0 25px rgba(0,0,0,0.8);
        }

        /* TEXTO */

        .portada {
            width: 100%;
            max-width: 1000px;

            text-align: center;
        }

        .portada h1 {
            margin: 0 0 10px;

            font-size: 42px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #d8b06a;

            text-shadow:
                2px 2px 4px rgba(0,0,0,0.7);
        }

        .portada h2 {
            margin: 0 0 20px;

            font-size: 21px;

            font-weight: normal;

            color: #fff;
        }

        .portada p {
            max-width: 720px;

            margin: 0 auto 25px;

            font-size: 17px;

            line-height: 1.5;

            color: #e6e6e6;
        }

        /* MENÚ */

        .menu {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;
        }

        .menu a {
            display: inline-block;

            padding: 9px 14px;

            color: #fff;

            text-decoration: none;

            border: 1px solid rgba(216,176,106,0.65);

            font-size: 16px;

            background: rgba(0,0,0,0.25);

            transition: background 0.3s ease,
                        color 0.3s ease,
                        border-color 0.3s ease;
        }

        .menu a:hover {
            background: rgba(216,176,106,0.15);

            color: #d8b06a;

            border-color: #d8b06a;
        }
