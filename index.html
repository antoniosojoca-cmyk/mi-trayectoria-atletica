
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi trayectoria atlética</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* =========================
           PORTADA
        ========================= */

        header {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0,0,0,0.08),
                    rgba(0,0,0,0.15)
                ),
                url("20180909_094909.jpg")
                center center / contain no-repeat;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            text-align: center;

            padding: 20px 15px 35px;

        }

        /* =========================
           TEXTO MUY DISCRETO
        ========================= */

        .portada {

            width: 100%;

            max-width: 950px;

            padding: 8px 10px;

            background: rgba(0,0,0,0.38);

        }

        .portada h1 {

            margin: 0 0 3px;

            font-size: 27px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #d8b06a;

            text-shadow:
                1px 1px 3px rgba(0,0,0,0.9);

        }

        .portada h2 {

            margin: 0 0 7px;

            font-size: 15px;

            font-weight: normal;

            color: #eee;

        }

        /* =========================
           MENÚ PEQUEÑO
        ========================= */

        .menu {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 5px;

        }

        .menu a {

            display: inline-block;

            padding: 5px 9px;

            color: #fff;

            text-decoration: none;

            border: 1px solid rgba(216,176,106,0.55);

            background: rgba(0,0,0,0.35);

            font-size: 13px;

            transition:
                background 0.3s ease,
                color 0.3s ease;

        }

        .menu a:hover {

            background: rgba(216,176,106,0.15);

            color: #d8b06a;

        }

        /* =========================
           PIE
        ========================= */

        footer {

            position: fixed;

            bottom: 10px;

            left: 0;

            right: 0;

            text-align: center;

            color: #999;

            font-size: 11px;

            z-index: 100;

        }

        /* =========================
           BOTÓN DE MÚSICA
        ========================= */

        #musicButton {

            position: fixed;

            bottom: 15px;

            right: 18px;

            width: 40px;

            height: 40px;

            border-radius: 50%;

            background: rgba(0,0,0,0.88);

            color: #d8b06a;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            z-index: 99999;

            border: 1px solid #d8b06a;

        }

        #musicButton:hover {

            background: rgba(216,176,106,0.15);

        }

        /* =========================
           YOUTUBE OCULTO
        ========================= */

        #youtubePlayer {

            position: fixed;

            width: 1px;

            height: 1px;

            left: -10px;

            bottom: -10px;

            overflow: hidden;

            opacity: 0;

            pointer-events: none;

        }

        #youtubePlayer iframe {

            width: 1px;

            height: 1px;

            border: 0;

        }

        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            header {

                padding: 10px 8px 30px;

            }

            .portada h1 {

                font-size: 21px;

                letter-spacing: 1.5px;

            }

            .portada h2 {

                font-size: 13px;

            }

            .menu a {

                font-size: 11px;

                padding: 4px 7px;

            }

        }

    </style>

</head>


<body>


    <header>


        <div class="portada">


            <h1>
                Mi trayectoria atlética
            </h1>


            <h2>
                Una vida entre kilómetros, carreras y nuevos caminos
            </h2>


            <nav class="menu">


                <a href="mi-historia.html">
                    Mi historia
                </a>


                <a href="mis-carreras.html">
                    Mis carreras
                </a>


               <a href="entrenamiento.html">Entrenamiento</a> 
                


              
                <a href="la-lesion.html">La lesión</a>

                <a href="#">
                    Marcha atlética
                </a>


                <a href="#">
                    Galería
                </a>


            </nav>


        </div>


    </header>


    <footer>

        Mi trayectoria atlética · 2026

    </footer>


    <!-- BOTÓN DE MÚSICA -->

    <div
        id="musicButton"
        onclick="toggleMusic()"
        title="Reproducir / pausar música">

        ♪

    </div>


    <!-- MÚSICA OCULTA -->

    <div id="youtubePlayer">

        <iframe
            id="musicFrame"
            src="https://www.youtube.com/embed/60ItHLz5WEA?autoplay=1&loop=1&playlist=60ItHLz5WEA&enablejsapi=1"
            allow="autoplay"
            frameborder="0">
        </iframe>

    </div>


    <script>

        let musicPlaying = false;


        function toggleMusic() {

            const frame =
                document.getElementById("musicFrame");


            if (!musicPlaying) {

                frame.contentWindow.postMessage(
                    '{"event":"command","func":"playVideo","args":""}',
                    "*"
                );

                frame.contentWindow.postMessage(
                    '{"event":"command","func":"unMute","args":""}',
                    "*"
                );

                document.getElementById("musicButton").innerHTML = "🔊";

                musicPlaying = true;

            } else {

                frame.contentWindow.postMessage(
                    '{"event":"command","func":"pauseVideo","args":""}',
                    "*"
                );

                document.getElementById("musicButton").innerHTML = "♪";

                musicPlaying = false;

            }

        }

    </script>


</body>

</html>
