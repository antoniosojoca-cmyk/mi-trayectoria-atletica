
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi trayectoria atlética</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* =====================================================
       CABECERA
    ===================================================== */

    .cabecera {
      position: relative;
      z-index: 20;

      width: 100%;

      padding: 22px 35px 18px;

      background: rgba(5, 5, 5, 0.92);

      border-bottom: 1px solid rgba(201, 163, 91, 0.65);

      text-align: center;
    }

    .titulo {
      margin: 0;

      color: #c9a35b;

      font-size: clamp(30px, 4vw, 50px);

      letter-spacing: 4px;

      font-weight: normal;
    }

    .subtitulo {
      margin-top: 7px;

      color: #dddddd;

      font-size: clamp(15px, 1.6vw, 19px);

      letter-spacing: 1px;
    }

    .linea {
      width: 90px;
      height: 1px;

      margin: 13px auto 15px;

      background: #c9a35b;
    }

    /* =====================================================
       MENÚ
    ===================================================== */

    .menu {
      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 8px 24px;
    }

    .menu a {
      color: #f1f1f1;

      text-decoration: none;

      font-size: 16px;

      letter-spacing: 0.5px;

      padding: 5px 4px;

      transition: color 0.25s ease;
    }

    .menu a:hover {
      color: #c9a35b;
    }

    /* =====================================================
       PORTADA
    ===================================================== */

    .portada {
      position: relative;

      width: 100%;

      min-height: calc(100vh - 152px);

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #111111;
    }

    /* Fondo desenfocado */
    .fondo-desenfocado {
      position: absolute;

      inset: -35px;

      background-image: url("https://github.com/antoniosojoca-cmyk/mi-trayectoria-atletica/blob/main/IMG_5793.jpg?raw=true");

      background-size: cover;

      background-position: center;

      filter: blur(22px);

      transform: scale(1.08);

      opacity: 0.72;
    }

    /* Capa suave */
    .capa {
      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.05)
        );
    }

    /* Fotografía principal */
    .imagen-principal {
      position: relative;

      z-index: 2;

      display: block;

      width: auto;

      height: auto;

   
      max-width: 97vw;
max-height: calc(100vh - 155px);

      object-fit: contain;

      box-shadow:
        0 12px 45px rgba(0, 0, 0, 0.55);

      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    /* =====================================================
       BOTÓN MÚSICA
    ===================================================== */

    #botonMusica {
      position: fixed;

      z-index: 100;

      top: 22px;

      right: 22px;

      width: 44px;

      height: 44px;

      border-radius: 50%;

      border: 1px solid #c9a35b;

      background: rgba(8, 8, 8, 0.88);

      color: #c9a35b;

      font-size: 21px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: 0.25s ease;
    }

    #botonMusica:hover {
      background: #c9a35b;

      color: #080808;
    }

    /* =====================================================
       YOUTUBE OCULTO
    ===================================================== */

    #reproductor {
      position: fixed;

      width: 1px;
      height: 1px;

      left: -100px;
      top: -100px;

      opacity: 0;

      pointer-events: none;
    }

    /* =====================================================
       FRASE INFERIOR
    ===================================================== */

    .frase {
      position: absolute;

      z-index: 10;

      bottom: 20px;

      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 40px);

      text-align: center;

      color: rgba(255, 255, 255, 0.92);

      font-size: 17px;

      letter-spacing: 1px;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* =====================================================
       MÓVIL
    ===================================================== */

    @media (max-width: 800px) {

      .cabecera {
        padding: 18px 18px 15px;
      }

      .titulo {
        font-size: 29px;
        letter-spacing: 2px;
      }

      .subtitulo {
        font-size: 15px;
      }

      .menu {
        gap: 4px 13px;
      }

      .menu a {
        font-size: 14px;
      }

      .portada {
        min-height: calc(100vh - 170px);
      }

      .imagen-principal {
        max-width: 96vw;
        max-height: calc(100vh - 210px);
      }

      .fondo-desenfocado {
        filter: blur(15px);
      }

      .frase {
        bottom: 12px;
        font-size: 14px;
      }

      #botonMusica {
        top: 12px;
        right: 12px;

        width: 40px;
        height: 40px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CABECERA
  ===================================================== -->

  <header class="cabecera">

    <h1 class="titulo">
      Mi trayectoria atlética
    </h1>

    <div class="subtitulo">
      Una vida entre kilómetros, carreras y nuevos caminos
    </div>

    <div class="linea"></div>


    <!-- ===================================================
         MENÚ
    =================================================== -->

    <nav class="menu">

      <a href="mi-historia.html">
        Mi historia
      </a>

      <a href="mis-carreras.html">
        Mis carreras
      </a>

      <a href="entrenamiento.html">
        Entrenamiento
      </a>

      <a href="la-lesion.html">
        La lesión
      </a>

      <a href="marcha-atletica.html">
        Marcha atlética
      </a>

      <a href="galeria.html">
        Galería
      </a>

    </nav>

  </header>


  <!-- =====================================================
       PORTADA
  ===================================================== -->

  <main class="portada">


    <!-- Fondo -->
    <div class="fondo-desenfocado"></div>


    <!-- Capa -->
    <div class="capa"></div>


    <!-- Fotografía protagonista -->
    <img
      class="imagen-principal"
      src="20180909_094909.jpg"
      alt="Mi trayectoria atlética"
    >


    <!-- Frase -->
    <div class="frase">
      Una vida entre kilómetros, carreras y nuevos caminos
    </div>


  </main>


  <!-- =====================================================
       BOTÓN DE MÚSICA
  ===================================================== -->

  <button
    id="botonMusica"
    aria-label="Controlar música">
    ♪
  </button>


  <!-- =====================================================
       YOUTUBE
  ===================================================== -->

  <div id="reproductor"></div>


  <script>

    let reproductor = null;

    let reproduciendo = false;


    function onYouTubeIframeAPIReady() {

      reproductor = new YT.Player(
        "reproductor",
        {

          height: "1",
          width: "1",

          videoId: "60ItHLz5WEA",

          playerVars: {

            autoplay: 1,

            loop: 1,

            playlist: "60ItHLz5WEA",

            controls: 0,

            modestbranding: 1,

            rel: 0

          },

          events: {

            onReady: function(event) {

              event.target.playVideo();

            },

            onStateChange: function(event) {

              if (
                event.data === YT.PlayerState.PLAYING
              ) {

                reproduciendo = true;

                document
                  .getElementById("botonMusica")
                  .textContent = "❚❚";

              }

              if (
                event.data === YT.PlayerState.PAUSED
              ) {

                reproduciendo = false;

                document
                  .getElementById("botonMusica")
                  .textContent = "♪";

              }

              if (
                event.data === YT.PlayerState.ENDED
              ) {

                event.target.playVideo();

              }

            }

          }

        }
      );

    }


    document
      .getElementById("botonMusica")
      .addEventListener(
        "click",
        function() {

          if (!reproductor) {
            return;
          }

          if (reproduciendo) {

            reproductor.pauseVideo();

          } else {

            reproductor.playVideo();

          }

        }
      );

  </script>


  <script
    src="https://www.youtube.com/iframe_api">
  </script>


</body>

</html>
