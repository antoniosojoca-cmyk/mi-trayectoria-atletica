

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi trayectoria atlética</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #030303;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}

/* =========================
   CABECERA
   ========================= */

header {
  background: #050505;
  text-align: center;
  padding: 8px 20px 14px;
  border-bottom: 1px solid #8f7130;
  position: relative;
  z-index: 10;
}

h1 {
  margin: 0;
  color: #c9a24d;
  font-size: 46px;
  letter-spacing: 1px;
  font-weight: normal;
}

.subtitulo {
  margin-top: 2px;
  color: #ffffff;
  font-size: 18px;
}

.linea {
  width: 78px;
  height: 2px;
  background: #c9a24d;
  margin: 10px auto 8px;
}

/* =========================
   MENU
   ========================= */

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 27px;
  flex-wrap: wrap;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  transition: 0.3s;
}

nav a:hover {
  color: #c9a24d;
}

/* =========================
   BOTON MUSICA
   ========================= */

#musicButton {
  position: absolute;
  right: 25px;
  top: 18px;

  width: 40px;
  height: 40px;

  border: 1px solid #c9a24d;
  border-radius: 50%;

  background: rgba(5,5,5,0.85);
  color: #c9a24d;

  font-size: 17px;
  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;

  transition: 0.3s;
}

#musicButton:hover {
  background: #c9a24d;
  color: #050505;
}

/* =========================
   PORTADA
   ========================= */

.portada {
  width: 100%;
  min-height: calc(100vh - 133px);

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 4px 0 0;

  /* FONDO MUCHO MAS OSCURO */
  background:
    radial-gradient(
      ellipse at center,
      #171717 0%,
      #090909 42%,
      #030303 72%,
      #000000 100%
    );

  position: relative;
}

/* Oscurece todavía más los extremos laterales */

.portada::before,
.portada::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 18%;
  pointer-events: none;
  z-index: 1;
}

.portada::before {
  left: 0;
  background: linear-gradient(
    to right,
    #000000 0%,
    rgba(0,0,0,0.95) 45%,
    rgba(0,0,0,0) 100%
  );
}

.portada::after {
  right: 0;
  background: linear-gradient(
    to left,
    #000000 0%,
    rgba(0,0,0,0.95) 45%,
    rgba(0,0,0,0) 100%
  );
}

/* =========================
   FOTOGRAFIA
   ========================= */

.marco {
  position: relative;
  z-index: 2;

  width: min(1200px, 92vw);
  height: calc(100vh - 140px);

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

.marco img {
  display: block;

  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;

  box-shadow:
    0 0 35px rgba(0,0,0,0.95),
    0 0 80px rgba(0,0,0,0.75);

  border-left: 1px solid rgba(201,162,77,0.15);
  border-right: 1px solid rgba(201,162,77,0.15);
}

/* =========================
   TEXTO SOBRE LA FOTO
   ========================= */

.frase {
  position: absolute;

  bottom: 18px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 4;

  color: white;

  font-size: 16px;
  font-weight: bold;

  text-align: center;

  text-shadow:
    0 2px 5px #000000,
    0 0 10px #000000;

  white-space: nowrap;
}

/* =========================
   YOUTUBE OCULTO
   ========================= */

#youtubePlayer {
  position: fixed;

  width: 1px;
  height: 1px;

  left: -10px;
  bottom: -10px;

  opacity: 0;
  pointer-events: none;
}

/* =========================
   MOVIL
   ========================= */

@media (max-width: 800px) {

  header {
    padding: 8px 10px 14px;
  }

  h1 {
    font-size: 31px;
  }

  .subtitulo {
    font-size: 15px;
  }

  nav {
    gap: 14px;
  }

  nav a {
    font-size: 14px;
  }

  #musicButton {
    right: 12px;
    top: 12px;

    width: 36px;
    height: 36px;
  }

  .portada {
    min-height: calc(100vh - 145px);
  }

  .marco {
    width: 100%;
    height: calc(100vh - 150px);
  }

  .marco img {
    max-width: 96%;
    max-height: 96%;
  }

  .frase {
    font-size: 13px;
    bottom: 10px;
    width: 90%;
    white-space: normal;
  }

  .portada::before,
  .portada::after {
    width: 10%;
  }
}

</style>
</head>


<body>


<!-- =========================
     CABECERA
     ========================= -->

<header>

<h1>Mi trayectoria atlética</h1>

<div class="subtitulo">
Una vida entre kilómetros, carreras y nuevos caminos
</div>

<div class="linea"></div>


<nav>

<a href="mi-historia.html">Mi historia</a>

<a href="carreras.html">Mis carreras</a>

<a href="entrenamiento.html">Entrenamiento</a>

<a href="lesion.html">La lesión</a>

<a href="marcha.html">Marcha atlética</a>

<a href="galeria.html">Galería</a>

</nav>


<button id="musicButton" onclick="toggleMusic()" title="Música">
♫
</button>

</header>


<!-- =========================
     PORTADA
     ========================= -->

<main class="portada">

<div class="marco">

<img
src="IMG-20180909-WA0005.jpg"
alt="Mi trayectoria atlética"
>

<div class="frase">
Una vida entre kilómetros, carreras y nuevos caminos
</div>

</div>

</main>


<!-- =========================
     YOUTUBE
     ========================= -->

<iframe
id="youtubePlayer"
src="https://www.youtube.com/embed/60ItHLz5WEA?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=60ItHLz5WEA&controls=0&rel=0"
allow="autoplay"
></iframe>


<script>

/* =========================
   MUSICA
   ========================= */

let player;
let musicOn = false;
let fadeTimer = null;


/* Cargar API de YouTube */

let tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";

let firstScriptTag = document.getElementsByTagName("script")[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);


/* Crear reproductor */

function onYouTubeIframeAPIReady() {

  player = new YT.Player("youtubePlayer", {

    events: {

      "onReady": function(event) {

        event.target.setVolume(0);

        /*
          Comenzamos con volumen 0 y lo
          subimos poco a poco.
        */

        event.target.playVideo();

        fadeInMusic();
      }

    }

  });

}


/* =========================
   ENTRADA SUAVE DE LA MUSICA
   ========================= */

function fadeInMusic() {

  if (!player) return;

  clearInterval(fadeTimer);

  let volume = 0;

  player.setVolume(0);

  fadeTimer = setInterval(function() {

    volume += 5;

    if (volume >= 100) {

      volume = 100;

      clearInterval(fadeTimer);

    }

    player.setVolume(volume);

  }, 180);

  musicOn = true;

  document.getElementById("musicButton").innerHTML = "Ⅱ";

}


/* =========================
   BOTON MUSICA
   ========================= */

function toggleMusic() {

  if (!player) return;

  if (musicOn) {

    player.pauseVideo();

    musicOn = false;

    document.getElementById("musicButton").innerHTML = "♫";

  } else {

    player.playVideo();

    fadeInMusic();

    document.getElementById("musicButton").innerHTML = "Ⅱ";

  }

}

</script>

</body>
</html>
