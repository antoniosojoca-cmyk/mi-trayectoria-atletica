

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi trayectoria atlética</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* FONDO GENERAL */

        body {
            position: relative;
            overflow-x: hidden;
        }

        /* FOTOGRAFÍA AMPLIADA PARA RELLENAR LOS LATERALES */

        body::before {
            content: "";

            position: fixed;

            top: -40px;
            left: -40px;

            width: calc(100% + 80px);
            height: calc(100% + 80px);

            background:
                linear-gradient(
                    rgba(0,0,0,0.35),
                    rgba(0,0,0,0.45)
                ),
                url("20180909_094909.jpg")
                center center / cover no-repeat;

            filter: blur(18px);

            transform: scale(1.08);

            z-index: -2;
        }

        /* OSCURECEMOS LIGERAMENTE EL FONDO */

        body::after {
            content: "";

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.20);

            z-index: -1;
        }

        /* PORTADA */

        header {
            min-height: 100vh;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            text-align: center;

            padding:
                35px
                20px
                95px;
        }

        /* FOTOGRAFÍA PRINCIPAL */

        header {
            background-image:
                url("20180909_094909.jpg");

            background-repeat: no-repeat;

            background-position:
                center center;

            background-size:
                contain;
        }

        .portada {
            width: 100%;

            max-width: 1100px;

            padding: 0;
        }

        /* TITULO */

        .portada h1 {
            margin: 0 0 8px;

            font-size: 42px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #d8b06a;

            text-shadow:
                2px 2px 6px rgba(0,0,0,0.95);
        }

        /* SUBTITULO */

        .portada h2 {
            margin: 0 0 20px;

            font-size: 20px;

            font-weight: normal;

            color: #fff;

            text-shadow:
                2px 2px 6px rgba(0,0,0,0.95);
        }

        /* EL TEXTO LARGO NO APARECE EN PORTADA */

        .portada p {
            display: none;
        }

        /* MENU */

        .menu {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;
        }

        .menu a {
            display: inline-block;

            padding: 8px 14px;

            color: #fff;

            text-decoration: none;

            background:
                rgba(0,0,0,0.62);

            border:
                1px solid
                rgba(216,176,106,0.80);

            font-size: 15px;

            transition:
                background 0.3s,
                color 0.3s;
        }

        .menu a:hover {
            background:
                rgba(216,176,106,0.20);

            color: #d8b06a;
        }

        /* PIE */

        footer {
            position: fixed;

            bottom: 12px;

            left: 0;
            right: 0;

            text-align: center;

            color: #ddd;

            font-size: 13px;

            z-index: 10;
        }

        /* BOTON MUSICA */

        #musicButton {
            position: fixed;

            bottom: 18px;
            right: 18px;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            background:
                rgba(0,0,0,0.75);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

            cursor: pointer;

            z-index: 9999;

            border:
                1px solid
                rgba(216,176,106,0.75);
        }

        /* YOUTUBE OCULTO */

        #youtubePlayer {
            position: fixed;

            width: 1px;
            height: 1px;

            left: -10px;
            bottom: -10px;

            overflow: hidden;
        }
