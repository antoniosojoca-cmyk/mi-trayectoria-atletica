
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi trayectoria atlética</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #000;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}


/* =========================
   CABECERA
   ========================= */

header {

  background: #050505;

  text-align: center;

  padding: 5px 20px 14px;

  border-bottom: 1px solid #9d7b32;

  position: relative;

  z-index: 10;
}


h1 {

  margin: 0;

  color: #c9a24d;

  font-size: 46px;

  font-weight: normal;

  letter-spacing: 1px;
}


.subtitulo {

  margin-top: 2px;

  color: #fff;

  font-size: 18px;
}


.linea {

  width: 78px;

  height: 2px;

  background: #c9a24d;

  margin: 9px auto 9px;
}


/* =========================
   MENU
   ========================= */

nav {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 27px;

  flex-wrap: wrap;
}


nav a {

  color: #fff;

  text-decoration: none;

  font-size: 16px;

  font-weight: bold;

  transition: 0.3s;
}


nav a:hover {

  color: #c9a24d;
}


/* =========================
   BOTON MUSICA
   ========================= */

#musicButton {

  position: absolute;

  right: 25px;

  top: 18px;

  width: 40px;

  height: 40px;

  border-radius: 50%;

  border: 1px solid #c9a24d;

  background: rgba(5,5,5,0.95);

  color: #c9a24d;

  font-size: 17px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  transition: 0.3s;

  z-index: 20;
}


#musicButton:hover {

  background: #c9a24d;

  color: #000;
}


/* =========================
   PORTADA
   ========================= */

.portada {

  width: 100%;

  min-height: calc(100vh - 132px);

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 4px 0 0;

  position: relative;

  background:

    radial-gradient(
      ellipse at center,
      #151515 0%,
      #080808 45%,
      #020202 75%,
      #000 100%
    );

  overflow: hidden;
}


/* OSCURECER LOS LATERALES */

.portada::before {

  content: "";

  position: absolute;

  left: 0;

  top: 0;

  bottom: 0;

  width: 30%;

  background:

    linear-gradient(
      to right,
      #000 0%,
      #000 25%,
      rgba(0,0,0,0.95) 55%,
      rgba(0,0,0,0) 100%
    );

  z-index: 1;

  pointer-events: none;
}


.portada::after {

  content: "";

  position: absolute;

  right: 0;

  top: 0;

  bottom: 0;

  width: 30%;

  background:

    linear-gradient(
      to left,
      #000 0%,
      #000 25%,
      rgba(0,0,0,0.95) 55%,
      rgba(0,0,0,0) 100%
    );

  z-index: 1;

  pointer-events: none;
}


/* =========================
   MARCO DE LA FOTO
   ========================= */

.marco {

  position: relative;

  z-index: 2;

  width: min(1200px, 92vw);

  height: calc(100vh - 140px);

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}


/* FOTO ORIGINAL */

.marco img {

  display: block;

  max-width: 100%;

  max-height: 100%;

  width: auto;

  height: auto;

  object-fit: contain;

  box-shadow:

    0 0 35px rgba(0,0,0,0.95),

    0 0 80px rgba(0,0,0,0.85);

  border-left: 1px solid rgba(201,162,77,0.18);

  border-right: 1px solid rgba(201,162,77,0.18);
}


/* =========================
   FRASE
   ========================= */

.frase {

  position: absolute;

  left: 50%;

  bottom: 17px;

  transform: translateX(-50%);

  z-index: 4;

  color: #fff;

  font-size: 16px;

  font-weight: bold;

  text-align: center;

  white-space: nowrap;

  text-shadow:

    0 2px 5px #000,

    0 0 10px #000;
}


/* =========================
   YOUTUBE OCULTO
   ========================= */

#youtubePlayer {

  position: fixed;

  width: 1px;

  height: 1px;

  left: -20px;

  bottom: -20px;

  border: 0;

  opacity: 0;

  pointer-events: none;
}


/* =========================
   MOVIL
   ========================= */

@media (max-width: 800px) {

  h1 {

    font-size: 31px;
  }

  .subtitulo {

    font-size: 15px;
  }

  nav {

    gap: 14px;
  }

  nav a {

    font-size: 14px;
  }

  #musicButton {

    right: 12px;

    top: 12px;

    width: 36px;

    height: 36px;
  }

  .portada {

    min-height: calc(100vh - 145px);
  }

  .marco {

    width: 100%;

    height: calc(100vh - 150px);
  }

  .marco img {

    max-width: 96%;

    max-height: 96%;
  }

  .frase {

    width: 90%;

    font-size: 13px;

    white-space: normal;

    bottom: 10px;
  }

  .portada::before,
  .portada::after {

    width: 18%;
  }

}

</style>

</head>


<body>


<!-- =========================
     CABECERA
     ========================= -->

<header>

<h1>Mi trayectoria atlética</h1>

<div class="subtitulo">
Una vida entre kilómetros, carreras y nuevos caminos
</div>

<div class="linea"></div>


<nav>

<a href="mi-historia.html">Mi historia</a>

<a href="mis-carreras.html">Mis carreras</a>

<a href="entrenamiento.html">Entrenamiento</a>

<a href="lesion.html">La lesión</a>

<a href="marcha.html">Marcha atlética</a>

<a href="galeria.html">Galería</a>

</nav>


<button
id="musicButton"
onclick="toggleMusic()"
title="Reproducir / detener música"
>
♫
</button>

</header>



<!-- =========================
     PORTADA
     ========================= -->

<main class="portada">

<div class="marco">


<img
src="IMG-20220905-WA0002.jpg"
alt="Mi trayectoria atlética"
>


<div class="frase">

Una vida entre kilómetros, carreras y nuevos caminos

</div>


</div>

</main>



<!-- =========================
     MUSICA YOUTUBE
     ========================= -->

<iframe

id="youtubePlayer"

src="https://www.youtube.com/embed/60ItHLz5WEA?enablejsapi=1&autoplay=1&mute=0&loop=1&playlist=60ItHLz5WEA&controls=0&rel=0&playsinline=1"

allow="autoplay; encrypted-media"

></iframe>



<script>

/* =========================
   CONTROL DE MUSICA
   ========================= */

let musicPlaying = false;


/* =========================
   ENVIAR ORDEN A YOUTUBE
   ========================= */

function youtubeCommand(command) {

  const iframe = document.getElementById("youtubePlayer");

  if (!iframe || !iframe.contentWindow) return;

  iframe.contentWindow.postMessage(

    JSON.stringify({

      event: "command",

      func: command,

      args: []

    }),

    "*"

  );

}


/* =========================
   BOTON DE MUSICA
   ========================= */

function toggleMusic() {

  if (musicPlaying) {

    youtubeCommand("pauseVideo");

    musicPlaying = false;

    document.getElementById("musicButton").innerHTML = "♫";

  } else {

    youtubeCommand("playVideo");

    musicPlaying = true;

    document.getElementById("musicButton").innerHTML = "Ⅱ";

  }

}


/* =========================
   INTENTO DE INICIO
   ========================= */

window.addEventListener("load", function() {

  setTimeout(function() {

    youtubeCommand("playVideo");

    musicPlaying = true;

    document.getElementById("musicButton").innerHTML = "Ⅱ";

  }, 1500);

});


/* =========================
   SI EL USUARIO HACE CLIC
   EN LA PAGINA, ACTIVAMOS
   LA MUSICA
   ========================= */

document.addEventListener("click", function(e) {

  if (e.target.id === "musicButton") return;

  if (!musicPlaying) {

    youtubeCommand("playVideo");

    musicPlaying = true;

    document.getElementById("musicButton").innerHTML = "Ⅱ";

  }

}, { once: true });

</script>


</body>

</html>
